<svg viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Ecosistema de Agentes IA · GLP — Flujo de Integración</title>
  <desc>Diagrama mostrando cómo Sofía (perfiladora conductual) interactúa con Sara (gestora de comunicación), Valeria (generadora de contenido) y el chatbot en tiempo real para personalizar la experiencia del prospecto.</desc>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arr-gold" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#B89047"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0369A1"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#047857"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="480" fill="#F7F4EF"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="14" font-weight="700" fill="#001A37" letter-spacing="1">ECOSISTEMA DE AGENTES IA · GLP</text>
  <text x="360" y="44" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#B89047" letter-spacing="1">FLUJO DE INTEGRACIÓN</text>

  <!-- LEGEND -->
  <rect x="20" y="440" width="680" height="32" fill="#EDE8DF" rx="2"/>
  <line x1="30" y1="456" x2="60" y2="456" stroke="#B89047" stroke-width="2" marker-end="url(#arr-gold)"/>
  <text x="68" y="460" font-family="Arial,sans-serif" font-size="9" fill="#374151">Perfil activo (hoy parcial)</text>
  <line x1="180" y1="456" x2="210" y2="456" stroke="#64748b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="218" y="460" font-family="Arial,sans-serif" font-size="9" fill="#374151">Integración pendiente</text>
  <line x1="340" y1="456" x2="370" y2="456" stroke="#047857" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="378" y="460" font-family="Arial,sans-serif" font-size="9" fill="#047857" font-weight="700">Chatbot en tiempo real</text>
  <rect x="500" y="448" width="10" height="10" fill="#B89047" rx="1"/>
  <text x="516" y="458" font-family="Arial,sans-serif" font-size="9" fill="#374151">Construido</text>
  <rect x="580" y="448" width="10" height="10" fill="none" stroke="#64748b" stroke-dasharray="2,2" rx="1"/>
  <text x="596" y="458" font-family="Arial,sans-serif" font-size="9" fill="#374151">Por construir</text>

  <!-- CHATBOT BOX (left) -->
  <rect x="30" y="65" width="140" height="90" fill="#fff" stroke="#047857" stroke-width="2" rx="3"/>
  <rect x="30" y="65" width="140" height="22" fill="#047857" rx="3"/>
  <rect x="30" y="75" width="140" height="12" fill="#047857"/>
  <text x="100" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#fff" letter-spacing="1.5">CHATBOT</text>
  <text x="100" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#374151">Captura respuestas</text>
  <text x="100" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#374151">del prospecto</text>
  <text x="100" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#047857" font-weight="700">→ señales conductuales</text>
  <text x="100" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#9CA3AF">[por construir]</text>

  <!-- PROSPECTO BOX (left-bottom) -->
  <rect x="30" y="200" width="140" height="70" fill="#fff" stroke="#64748b" stroke-width="1.5" rx="3" stroke-dasharray="5,3"/>
  <text x="100" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#374151" letter-spacing="1">PROSPECTO</text>
  <text x="100" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#6B7280">Interactúa con chatbot</text>
  <text x="100" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#6B7280">responde preguntas</text>
  <text x="100" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#6B7280">expresa intereses</text>

  <!-- Arrow prospecto to chatbot -->
  <line x1="100" y1="200" x2="100" y2="160" stroke="#047857" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- SOFIA BOX (center) -->
  <rect x="270" y="55" width="180" height="130" fill="#fff" stroke="#B89047" stroke-width="2.5" rx="3"/>
  <rect x="270" y="55" width="180" height="26" fill="#001A37" rx="3"/>
  <rect x="270" y="68" width="180" height="13" fill="#001A37"/>
  <text x="360" y="72" text-anchor="middle" font-family="Georgia,serif" font-size="11" font-weight="700" fill="#B89047" letter-spacing="2">SOFÍA</text>
  <text x="360" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#B89047" letter-spacing="1.5">PERFILADORA CONDUCTUAL</text>
  <text x="360" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#374151">Clasifica arquetipos:</text>
  <rect x="285" y="110" width="65" height="14" fill="#6D28D9" rx="2"/>
  <text x="317" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#fff" font-weight="700">ESTATUS</text>
  <rect x="355" y="110" width="80" height="14" fill="#1D4ED8" rx="2"/>
  <text x="395" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#fff" font-weight="700">LEGADO</text>
  <rect x="285" y="128" width="70" height="14" fill="#047857" rx="2"/>
  <text x="320" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#fff" font-weight="700">RACIONAL</text>
  <rect x="360" y="128" width="78" height="14" fill="#B45309" rx="2"/>
  <text x="399" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#fff" font-weight="700">ASPIRACIONAL</text>
  <text x="360" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#9CA3AF" font-style="italic">genera recomendaciones para Sara y Valeria</text>
  <text x="360" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#B89047" font-weight="700">⟵ estado actual: texto estático en perfil</text>

  <!-- Chatbot to Sofia arrow (real-time) -->
  <path d="M 170,105 Q 220,105 270,100" fill="none" stroke="#047857" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="220" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#047857" font-weight="700">señales RT</text>

  <!-- Sofia to chatbot redirect arrow -->
  <path d="M 270,120 Q 220,130 170,130" fill="none" stroke="#B89047" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-gold)"/>
  <text x="220" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#B89047">redirige flujo</text>

  <!-- SARA BOX (top right) -->
  <rect x="510" y="55" width="175" height="110" fill="#fff" stroke="#0369A1" stroke-width="2" rx="3"/>
  <rect x="510" y="55" width="175" height="22" fill="#0369A1" rx="3"/>
  <rect x="510" y="65" width="175" height="12" fill="#0369A1"/>
  <text x="597" y="71" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#fff" letter-spacing="2">SARA</text>
  <text x="597" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#fff" letter-spacing="1">GESTORA DE COMUNICACIÓN</text>
  <text x="597" y="100" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#374151">Responde emails y consultas</text>
  <text x="597" y="114" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#374151">Tono adaptado al arquetipo</text>
  <text x="597" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#374151">Seguimiento automatizado</text>
  <text x="597" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#0369A1" font-weight="700">[leer perfil Sofía → hoy manual]</text>

  <!-- Sofia to Sara -->
  <path d="M 450,85 L 508,85" fill="none" stroke="#B89047" stroke-width="2" marker-end="url(#arr-gold)"/>
  <text x="479" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#B89047" font-weight="700">arquetipo</text>
  <text x="479" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#B89047">+ señales</text>

  <!-- VALERIA BOX (bottom right) -->
  <rect x="510" y="220" width="175" height="120" fill="#fff" stroke="#7C3AED" stroke-width="2" rx="3"/>
  <rect x="510" y="220" width="175" height="22" fill="#7C3AED" rx="3"/>
  <rect x="510" y="230" width="175" height="12" fill="#7C3AED"/>
  <text x="597" y="236" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#fff" letter-spacing="2">VALERIA</text>
  <text x="597" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#fff" letter-spacing="1">GENERADORA DE CONTENIDO</text>
  <text x="597" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#374151">Guiones por arquetipo</text>
  <text x="597" y="279" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#374151">Propuestas personalizadas</text>
  <text x="597" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#374151">Presentaciones adaptadas</text>
  <text x="597" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="#374151">Objeciones por perfil</text>
  <text x="597" y="328" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#7C3AED" font-weight="700">[leer perfil Sofía → hoy manual]</text>

  <!-- Sofia to Valeria -->
  <path d="M 360,185 Q 360,240 510,265" fill="none" stroke="#B89047" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-gold)"/>
  <text x="420" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#B89047" font-weight="700">perfil conductual</text>

  <!-- RESULTADO BOX (bottom center) -->
  <rect x="200" y="310" width="260" height="95" fill="#fff" stroke="#001A37" stroke-width="1.5" rx="3"/>
  <rect x="200" y="310" width="260" height="20" fill="#001A37" rx="3"/>
  <rect x="200" y="318" width="260" height="12" fill="#001A37"/>
  <text x="330" y="325" text-anchor="middle" font-family="Georgia,serif" font-size="10" font-weight="700" fill="#B89047" letter-spacing="2">FLUJO IDEAL</text>
  <text x="215" y="348" font-family="Arial,sans-serif" font-size="8.5" fill="#374151">1. Chatbot captura señales en vivo</text>
  <text x="215" y="361" font-family="Arial,sans-serif" font-size="8.5" fill="#374151">2. Sofía clasifica arquetipo en tiempo real</text>
  <text x="215" y="374" font-family="Arial,sans-serif" font-size="8.5" fill="#374151">3. Chatbot adapta preguntas siguientes</text>
  <text x="215" y="387" font-family="Arial,sans-serif" font-size="8.5" fill="#374151">4. Sara/Valeria reciben contexto automático</text>
  <text x="215" y="400" font-family="Arial,sans-serif" font-size="8.5" fill="#374151">5. Respuesta y guión ya personalizados</text>

  <!-- Result to agents -->
  <line x1="460" y1="355" x2="510" y2="165" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <line x1="460" y1="370" x2="510" y2="270" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr)"/>
</svg>
