<script>
window.onerror = function(msg, url, line, col, error) {
  document.body.innerHTML = '<div style="color:red;padding:20px;font-size:20px;z-index:99999;position:absolute;top:0;background:white;width:100%;"><h1 style="font-size: 24px;">Runtime Error</h1><p>' + msg + '</p><pre>' + (error ? error.stack : '') + '</pre></div>';
};
window.addEventListener('unhandledrejection', function(e) {
  document.body.innerHTML = '<div style="color:red;padding:20px;font-size:20px;z-index:99999;position:absolute;top:0;background:white;width:100%;"><h1 style="font-size: 24px;">Unhandled Rejection</h1><p>' + (e.reason ? e.reason.stack || e.reason : e) + '</p></div>';
});
</script>
